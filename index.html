<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma Estratégico – Vendas Online e Escala Operacional</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
background:#f3f4f6;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
background:white;
border-radius:10px;
box-shadow:0 4px 6px rgba(0,0,0,0.1);
padding:30px;
}

h1{
color:#1f2937;
margin-bottom:10px;
}

.subtitle{
color:#6b7280;
margin-bottom:20px;
}

.progress-summary{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:20px;
border-radius:10px;
margin-bottom:30px;
display:flex;
justify-content:space-around;
flex-wrap:wrap;
}

.progress-number{
font-size:2.5em;
font-weight:bold;
}

.progress-bar-container{
width:100%;
height:25px;
background:rgba(255,255,255,0.3);
border-radius:15px;
margin-top:10px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:#10b981;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.controls{
margin-bottom:20px;
}

.btn{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin-right:10px;
}

.btn-reset{background:#ef4444;color:white;}
.btn-export{background:#3b82f6;color:white;}

.instructions{
background:#dbeafe;
padding:20px;
border-radius:8px;
margin-bottom:30px;
}

.gantt-header{
display:flex;
border-bottom:2px solid #e5e7eb;
margin-bottom:20px;
padding-bottom:10px;
}

.gantt-label{
width:300px;
font-weight:bold;
}

.gantt-weeks{
flex:1;
display:flex;
}

.week{
flex:1;
text-align:center;
font-size:0.85em;
border-left:1px solid #e5e7eb;
}

.phase{
border:1px solid #e5e7eb;
border-radius:8px;
margin-bottom:15px;
background:white;
}

.phase.completed{
border-color:#10b981;
background:#f0fdf4;
}

.phase-header{
display:flex;
align-items:center;
padding:15px;
cursor:pointer;
}

.phase-info{
width:300px;
}

.phase-name{
font-weight:bold;
margin-bottom:5px;
}

.phase-chart{
flex:1;
position:relative;
height:40px;
}

.phase-grid{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
display:flex;
}

.grid-cell{
flex:1;
border-left:1px solid #e5e7eb;
}

.phase-bar{
position:absolute;
height:30px;
border-radius:6px;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:0.8em;
font-weight:bold;
}

.color-blue{background:#3b82f6;}
.color-green{background:#10b981;}
.color-purple{background:#8b5cf6;}
.color-orange{background:#f97316;}
.color-red{background:#ef4444;}
.color-indigo{background:#6366f1;}
.color-teal{background:#14b8a6;}

.phase-tasks{
display:none;
padding:20px;
background:#f9fafb;
border-top:1px solid #e5e7eb;
}

.phase-tasks.active{
display:block;
}

.task-item{
display:flex;
padding:10px;
background:white;
border:1px solid #e5e7eb;
border-radius:6px;
margin-bottom:8px;
cursor:pointer;
}

.task-item.completed{
background:#f0fdf4;
border-color:#10b981;
}

.task-checkbox{
width:20px;
height:20px;
border:2px solid #d1d5db;
border-radius:4px;
margin-right:10px;
display:flex;
align-items:center;
justify-content:center;
}

.task-item.completed .task-checkbox{
background:#10b981;
border-color:#10b981;
color:white;
}

.task-date{
font-size:0.75em;
color:#10b981;
}

</style>
</head>

<body>

<div class="container">

<h1>Cronograma Estratégico – Vendas Online</h1>
<p class="subtitle">Focado em gerar renda com vendas online, ampliar catálogo e preparar a base para escalar com organização.</p>

<div class="progress-summary">
<div>
<span class="progress-number" id="completed-tasks">0</span>
Tarefas concluídas
</div>

<div>
<span class="progress-number" id="total-tasks">0</span>
Total tarefas
</div>

<div>
<span class="progress-number" id="completed-phases">0</span>
Fases completas
</div>

<div class="progress-bar-container">
<div class="progress-bar" id="progress-bar">0%</div>
</div>
</div>

<div class="controls">
<button class="btn btn-export" onclick="exportProgress()">Exportar progresso</button>
<button class="btn btn-reset" onclick="resetProgress()">Resetar</button>
</div>

<div class="instructions">
Clique na fase para ver tarefas. Clique na tarefa para marcar como concluída.
</div>

<div class="gantt-header">
<div class="gantt-label">Fase</div>
<div class="gantt-weeks" id="weeks-header"></div>
</div>

<div id="phases-container"></div>

</div>

<script>

var phases = [

{
id:1,
name:"INÍCIO NO MERCADO LIVRE",
duration:"Fase inicial",
start:0,
length:1,
color:"color-blue",
tasks:[
"Criar conta vendedor no Mercado Livre",
"Estudar funcionamento do marketplace",
"Analisar concorrência",
"Criar primeiros anúncios",
"Publicar primeiros produtos"
]
},

{
id:2,
name:"REVISÃO DA ESTRATÉGIA",
duration:"Reorganização",
start:1,
length:1,
color:"color-green",
tasks:[
"Perceber necessidade de ERP",
"Escolher Bling",
"Planejar reorganização da operação"
]
},

{
id:3,
name:"IMPLANTAÇÃO DO BLING",
duration:"Estrutura",
start:2,
length:2,
color:"color-purple",
tasks:[
"Cadastrar produtos no Bling",
"Criar SKUs padronizados",
"Integrar Bling com Mercado Livre",
"Configurar NF-e"
]
},

{
id:4,
name:"PRIMEIRA VENDA OPERACIONAL",
duration:"Validação",
start:4,
length:1,
color:"color-orange",
tasks:[
"Receber primeira venda",
"Emitir NF-e",
"Gerar DANFE",
"Imprimir etiqueta",
"Postar pedido"
]
},

{
id:5,
name:"ORGANIZAÇÃO DA OPERAÇÃO",
duration:"Estrutura",
start:5,
length:2,
color:"color-red",
tasks:[
"Criar estrutura de pastas",
"Separar XML e DANFE",
"Criar scripts de organização",
"Documentar processos"
]
},

{
id:6,
name:"EXPANSÃO DE ANÚNCIOS",
duration:"Fase atual",
start:7,
length:2,
color:"color-indigo",
tasks:[
"Criar novos anúncios",
"Melhorar SEO",
"Criar imagens com IA",
"Criar kits de produtos"
]
},

{
id:7,
name:"ESCALA DA OPERAÇÃO",
duration:"Próximos passos",
start:9,
length:3,
color:"color-teal",
tasks:[
"Criar Pacote Mestre de Produto",
"Criar padrão de cadastro",
"Manual operacional da empresa",
"Backup automático"
]
}

];

var completedTasks={
"1-0":"01/03/2026",
"1-1":"01/03/2026",
"1-2":"01/03/2026",
"1-3":"01/03/2026",
"1-4":"01/03/2026",

"2-0":"03/03/2026",
"2-1":"03/03/2026",
"2-2":"03/03/2026",

"3-0":"05/03/2026",
"3-1":"05/03/2026",
"3-2":"06/03/2026",
"3-3":"06/03/2026",

"4-0":"07/03/2026",
"4-1":"07/03/2026",
"4-2":"07/03/2026",
"4-3":"07/03/2026",
"4-4":"07/03/2026",

"5-0":"08/03/2026",
"5-1":"08/03/2026",
"5-2":"08/03/2026",
"5-3":"08/03/2026"
};

function loadProgress(){
var saved=localStorage.getItem("cronogramaML");
if(saved){completedTasks=JSON.parse(saved);}
}

function saveProgress(){
localStorage.setItem("cronogramaML",JSON.stringify(completedTasks));
updateProgress();
}

function toggleTask(p,t){

var k=p+"-"+t;

if(completedTasks[k]) delete completedTasks[k];
else completedTasks[k]=new Date().toLocaleDateString("pt-BR");

saveProgress();
renderPhases();

}

function updateProgress(){

var total=0;
var done=0;
var phasesDone=0;

phases.forEach(function(ph){

var c=0;

ph.tasks.forEach(function(t,i){

total++;
var k=ph.id+"-"+i;

if(completedTasks[k]){
done++;
c++;
}

});

if(c===ph.tasks.length) phasesDone++;

});

var pct=Math.round(done/total*100);

document.getElementById("completed-tasks").textContent=done;
document.getElementById("total-tasks").textContent=total;
document.getElementById("completed-phases").textContent=phasesDone;

var bar=document.getElementById("progress-bar");
bar.style.width=pct+"%";
bar.textContent=pct+"%";

}

function togglePhase(id){

var el=document.getElementById("tasks-"+id);

if(el.classList.contains("active"))
el.classList.remove("active");
else
el.classList.add("active");

}

function renderPhases(){

var c=document.getElementById("phases-container");
c.innerHTML="";

phases.forEach(function(ph){

var d=document.createElement("div");
d.className="phase";

var done=0;

ph.tasks.forEach(function(t,i){
if(completedTasks[ph.id+"-"+i]) done++;
});

if(done===ph.tasks.length) d.classList.add("completed");

var left=(ph.start/12)*100;
var width=(ph.length/12)*100;

var grid="";
for(var i=0;i<12;i++) grid+="<div class='grid-cell'></div>";

var tasks="";

ph.tasks.forEach(function(t,i){

var k=ph.id+"-"+i;
var doneClass=completedTasks[k]?"completed":"";
var date=completedTasks[k]?"<div class='task-date'>✔ "+completedTasks[k]+"</div>":"";

tasks+="<div class='task-item "+doneClass+"' onclick='toggleTask("+ph.id+","+i+")'>";
tasks+="<div class='task-checkbox'></div>";
tasks+="<div>"+t+date+"</div>";
tasks+="</div>";

});

d.innerHTML=
"<div class='phase-header' onclick='togglePhase("+ph.id+")'>"+
"<div class='phase-info'><div class='phase-name'>"+ph.name+"</div>"+ph.duration+"</div>"+
"<div class='phase-chart'>"+
"<div class='phase-grid'>"+grid+"</div>"+
"<div class='phase-bar "+ph.color+"' style='left:"+left+"%;width:"+width+"%'>"+ph.duration+"</div>"+
"</div></div>"+
"<div class='phase-tasks' id='tasks-"+ph.id+"'>"+tasks+"</div>";

c.appendChild(d);

});

updateProgress();

}

document.addEventListener("DOMContentLoaded",function(){

var w=document.getElementById("weeks-header");

for(var i=1;i<=12;i++){
var e=document.createElement("div");
e.className="week";
e.textContent="S"+i;
w.appendChild(e);
}

loadProgress();
renderPhases();

});

function resetProgress(){

if(confirm("Resetar progresso?")){
completedTasks={};
saveProgress();
renderPhases();
}

}

function exportProgress(){

var r="RELATÓRIO CRONOGRAMA\n\n";

phases.forEach(function(ph){

r+=ph.name+"\n";

ph.tasks.forEach(function(t,i){

var k=ph.id+"-"+i;

r+=(completedTasks[k]?"[OK] ":"[ ] ")+t+"\n";

});

r+="\n";

});

var blob=new Blob([r],{type:"text/plain"});
var url=URL.createObjectURL(blob);
var a=document.createElement("a");
a.href=url;
a.download="progresso.txt";
a.click();

}

</script>

</body>
</html>
